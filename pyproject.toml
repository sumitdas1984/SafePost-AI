[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safepost-ai"
version = "0.1.0"
description = "End-to-end social media text moderation ML platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "SafePost AI Contributors" },
]
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "streamlit",
    "seaborn>=0.13.2",
    "nltk>=3.10.3",
    "wordcloud>=1.9.6",
    "tensorflow>=2.21.0",
    "transformers>=5.16.1",
    "datasets>=5.0.1",
    "accelerate>=1.14.0",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.1",
    "torch>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "httpx",
    "ipykernel>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "torch>=2.2",
    "nbformat>=5.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
