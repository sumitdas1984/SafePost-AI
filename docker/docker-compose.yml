# SafePost AI — local docker-compose.
#
# Run from the repo root:
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Brings up the FastAPI backend (port 8000) and the Streamlit UI
# (port 8501). The Streamlit container talks to the API via the
# in-network DNS name `api`, so no host-port mapping is needed for
# the API URL — just point API_URL=http://api:8000.
#
# For development iteration on the model artifact, the API service
# mounts `./models` as a read-only volume so you can drop a new
# model in without rebuilding the image. In production, the model
# is baked into the image (see docker/api/Dockerfile).

services:
  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    image: safepost-ai-api:latest
    container_name: safepost-ai-api
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # Live-mount the model directory so dev iterations on the
      # model don't require an image rebuild. Read-only.
      - ../models:/app/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  streamlit:
    build:
      context: ..
      dockerfile: docker/streamlit/Dockerfile
    image: safepost-ai-streamlit:latest
    container_name: safepost-ai-streamlit
    ports:
      - "8501:8501"
    environment:
      # Use the in-network DNS name so we don't depend on the
      # host-side port mapping for the API.
      API_URL: "http://api:8000"
      PYTHONUNBUFFERED: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
